<body>
  <div id="app"></div>
  <!-- Handle SPA routing redirects from 404.html -->
  <script>
    (function () {
      const redirect = sessionStorage.getItem('redirect');
      if (redirect) {
        sessionStorage.removeItem('redirect');
        if (redirect !== window.location.pathname) {
          history.replaceState(null, null, redirect);
        }
      }
    })();
  </script>
